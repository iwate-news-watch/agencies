name: Inspect sources

# 取得元の確認用（手動実行のみ）。sources.yaml の各取得元から拾える記事を
# reports/inspect_sources.csv に書き出し、実行したブランチにコミットする。state は更新しない
on:
  workflow_dispatch:
    inputs:
      save_html:
        description: "scrape の取得元のページを reports/html/ に保存する"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect sources
        env:
          TZ: Asia/Tokyo
        run: python scripts/inspect_sources.py ${{ inputs.save_html && '--html' || '' }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "Inspect sources: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
