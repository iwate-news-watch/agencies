# 調査用ワークフロー（Survey agencies）の調査対象。
#
#   output:   結果のCSVの保存先（調査のたびに変えると、前回の結果を残せる）
#   targets:  調査するサイト
#     category / name : 分類と名称
#     urls            : 調べるページ（1つ以上）。トップページのほか、一覧ページが分かっていればそのURLも
#     hints           : (任意) 一覧ページがありそうな場所。そのURL自体も候補にし、その下にあるリンクを優先して調べる
#     keywords        : (任意) 記事を絞り込むキーワード。候補ごとに、絞った場合の件数も記録する
#     via_proxy       : (任意) true なら Cloudflare Worker（docs/config.json の trigger_url）の /proxy 経由で取得する
#                       （GitHub Actions から直接取得できないサイト用。Worker 側で許可したホストだけ取得できる）
#
# URL は候補です。誤っていれば調査結果にエラーとして記録されます。
# これまでの調査結果:
#   reports/survey_agencies.csv   … 1回目（20サイト）
#   reports/survey_agencies_2.csv … 2回目（準備中だった北上川ダム・三陸国道・南三陸沿岸国道・東北農政局・岩手県立大学）
#   reports/survey_agencies_3.csv … 3回目（岩手県立大学を Worker 経由で）
#   reports/survey_agencies_4.csv … 4回目（県の試験研究・普及機関の2機関）

output: reports/survey_agencies_4.csv

targets:
  # 4回目: 県の試験研究・普及機関
  # GitHub Actions から 403 になったら、Worker の変数 PROXY_ALLOWED_HOSTS にホストを足し（README の「Worker の /proxy」）、
  # その機関に via_proxy: true を付けて調査し直す
  - category: 県の試験研究・普及機関
    name: いわてアグリベンチャーネット
    # ページ下部に「新着更新情報」と「RSSフィード」のリンクがある（どちらも自動で探す）
    urls: ["https://www.pref.iwate.jp/agri/i-agri/"]
  - category: 県の試験研究・普及機関
    name: 岩手県水産技術センター
    # WordPress のサイト。/feed/ はよくあるパスとして自動で試す
    urls: ["https://www2.suigi.pref.iwate.jp/"]
