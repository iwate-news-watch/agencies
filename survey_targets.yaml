# 調査用ワークフロー（Survey agencies）の調査対象。
#
#   output:   結果のCSVの保存先（調査のたびに変えると、前回の結果を残せる）
#   targets:  調査するサイト
#     category / name : 分類と名称
#     urls            : 調べるページ（1つ以上）。トップページのほか、一覧ページが分かっていればそのURLも
#     hints           : (任意) 一覧ページがありそうな場所。そのURL自体も候補にし、その下にあるリンクを優先して調べる
#     keywords        : (任意) 記事を絞り込むキーワード。候補ごとに、絞った場合の件数も記録する
#
# URL は候補です。誤っていれば調査結果にエラーとして記録されます。
# 1回目の調査（20サイト）の結果は reports/survey_agencies.csv にあります。

output: reports/survey_agencies_2.csv

targets:
  - category: 国の機関
    name: 北上川ダム統合管理事務所
    urls: ["https://www.thr.mlit.go.jp/kitakato/"]
  - category: 国の機関
    name: 三陸国道事務所
    urls: ["https://www.thr.mlit.go.jp/sanriku/"]
    hints: ["https://www.thr.mlit.go.jp/sanriku/01_press/"]
  - category: 国の機関
    name: 南三陸沿岸国道事務所
    urls: ["https://www.thr.mlit.go.jp/minamisanriku/"]
    hints: ["https://www.thr.mlit.go.jp/minamisanriku/kisha/"]
  - category: 国の機関
    name: 東北農政局
    urls: ["https://www.maff.go.jp/tohoku/stinfo/index.html", "https://www.maff.go.jp/tohoku/press/houdou.html"]
    keywords: [岩手]
  - category: 国の機関
    name: 釜石海上保安部
    urls: ["https://www.kaiho.mlit.go.jp/02kanku/kamaishi/", "https://www.kaiho.mlit.go.jp/02kanku/"]
    keywords: [釜石, 宮古, 岩手]
  - category: 大学・研究機関
    name: 岩手県立大学
    urls: ["https://www.iwate-pu.ac.jp/"]
