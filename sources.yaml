# 岩手県内の国の出先機関・大学の取得元一覧
#
# 各機関の sources に取得元を並べます（複数可。記事URLで重複を除きます）。
#   type: rss     … RSS / Atom フィード
#   type: scrape  … RSSのないサイト。ページ内の日付の直後にある最初のリンクを記事とみなす
#     date_format: dotted  … 「2026.10.15」形式
#     date_format: slash   … 「2026/10/16」形式
#     date_format: kanji   … 「2026年11月5日」形式
#     date_format: reiwa   … 「令和8年 10月15日」形式
#     date_format: reiwa_short … 「R8.11.6」形式
#     date_format: monthday … 「11月4日」形式（年なし。年は取得日から推定。date_position: after と組み合わせる）
#     selector: (任意) 記事一覧部分のCSSセレクタ。指定するとその範囲だけを走査
#       （複数の範囲に当たる場合は範囲ごとに走査し、範囲をまたいで日付とリンクを組にしない）
#     date_position: (任意) before … 日付の後のリンクを記事にする（既定）
#                           after  … リンクの後の日付をその記事の日付にする（日付がタイトルの後ろにあるサイト）
#     title_from: (任意) link … リンクの文字をタイトルにする（既定）
#                        text … 日付から次の日付までの文章をタイトルにし、その中の最初のリンクを記事のURLにする
#                               （「詳細はこちら」のように本文中にリンクがあるサイト）
#
# include_keywords: (任意・rss/scrape 共通) タイトルにどれかの語を含む記事だけを拾う
#   例: include_keywords: [岩手, 盛岡]（全角半角・大文字小文字は区別しない）
#
# homepage: ページで機関名からリンクする公式ホームページのURL（各機関のトップ）。
#   省略すると、最初の取得元URLのドメインのトップ（https://ドメイン/）にリンクします。
#
# via_proxy: (任意) true なら Cloudflare Worker（docs/config.json の trigger_url）の /proxy 経由で取得する。
#   GitHub Actions から直接取得できないサイト用。Worker 側で許可したホスト（既定は www.iwate-pu.ac.jp）だけ取得できる。
#
# preparing: true … 準備中。取得はせず、ページ下部の「準備中」に homepage へのリンクだけ表示します。
#
# sources が空（preparing でもない）の機関はページに「取得元未設定」と表示されます。
#
# 分類（国の機関／大学・研究機関）と読みは scripts/build.py の CATEGORIES にあります。
# 取得元の候補は「Survey agencies」ワークフローの結果（reports/survey_agencies.csv）を参考にしてください。

organizations:
  # ---- 国の機関 ----
  - name: 盛岡地方気象台
    homepage: https://www.data.jma.go.jp/morioka/
    sources:
      - type: scrape
        url: https://www.data.jma.go.jp/morioka/
        date_format: reiwa
        selector: "section#press"  # 「報道発表・お知らせ」欄だけ（上のピックアップを除く）
  - name: 岩手労働局
    homepage: https://jsite.mhlw.go.jp/iwate-roudoukyoku/
    sources:
      - type: rss
        url: https://jsite.mhlw.go.jp/iwate-roudoukyoku/rss/iwate-roudoukyoku-news.xml
      - type: rss
        url: https://jsite.mhlw.go.jp/iwate-roudoukyoku/rss/iwate-roudoukyoku-event.xml
      - type: scrape
        url: https://jsite.mhlw.go.jp/iwate-roudoukyoku/news_topics/houdou.html
        date_format: kanji
  - name: 岩手河川国道事務所
    homepage: https://www.thr.mlit.go.jp/iwate/
    sources:
      - type: scrape
        url: https://www.thr.mlit.go.jp/iwate/
        date_format: dotted
        selector: "dl.dl_list"  # 新着情報の一覧だけ（「もっと見る」を除く）
  - name: 盛岡財務事務所
    homepage: https://lfb.mof.go.jp/tohoku/morioka/
    sources:
      - type: scrape
        url: https://lfb.mof.go.jp/tohoku/morioka/soumu/pagethkhp04500008.html
        date_format: reiwa
        selector: "ul.newsList"
  - name: 北上川ダム統合管理事務所
    homepage: https://www.thr.mlit.go.jp/kitakato/
    sources:
      - type: scrape
        url: https://www.thr.mlit.go.jp/kitakato/102kisya/index.html
        date_format: kanji
  - name: 三陸国道事務所
    homepage: https://www.thr.mlit.go.jp/sanriku/
    sources:
      - type: scrape
        url: https://www.thr.mlit.go.jp/sanriku/01_press/
        date_format: reiwa
  - name: 南三陸沿岸国道事務所
    homepage: https://www.thr.mlit.go.jp/minamisanriku/
    sources:
      - type: scrape
        url: https://www.thr.mlit.go.jp/minamisanriku/kisha/index.html
        date_format: reiwa_short  # 「R8.11.6」形式
        selector: "div.post"      # 記者発表の表（メニューを除く）
  - name: 東北農政局（東北6県）
    homepage: https://www.maff.go.jp/tohoku/
    sources:
      # 東北6県まとめての発表にも岩手の情報が含まれるため、キーワードで絞らずすべて拾う
      - type: scrape
        url: https://www.maff.go.jp/tohoku/press/houdou.html
        date_format: monthday     # 「［11月4日］」形式（年は取得日から推定）
        date_position: after      # 日付がタイトルの後ろにある
        selector: "dl.list_item dd"  # 各月の発表だけ（月の目次・過年度へのリンクを除く）
  - name: 日本銀行盛岡事務所
    homepage: https://www3.boj.or.jp/morioka/
    sources:
      - type: scrape
        url: https://www3.boj.or.jp/morioka/
        date_format: kanji
        selector: "section#news"  # 新着情報の欄だけ（メニュー・ロゴを除く）

  # ---- 大学・研究機関 ----
  - name: 岩手大学
    homepage: https://www.iwate-u.ac.jp/
    sources:
      - type: rss
        url: https://www.iwate-u.ac.jp/atom.xml
  - name: 岩手県立大学
    homepage: https://www.iwate-pu.ac.jp/
    sources:
      # GitHub Actions からの直接の取得は HTTP 403（CloudFront で遮断）のため Worker 経由で取得する。
      # 新着情報一覧（/news）と同じ記事の Atom フィード（トップページの link rel=alternate）
      - type: rss
        url: https://www.iwate-pu.ac.jp/feeds/feed-page.xml
        via_proxy: true
  - name: 岩手医科大学
    homepage: https://www.iwate-med.ac.jp/
    sources:
      - type: scrape
        url: https://www.iwate-med.ac.jp/category/news/
        date_format: dotted
        selector: "div.archive-index"
      - type: scrape
        url: https://www.iwate-med.ac.jp/category/topics/
        date_format: dotted
        selector: "div.archive-index"
  - name: 盛岡大学
    homepage: https://morioka-u.ac.jp/
    sources:
      - type: scrape
        url: https://morioka-u.ac.jp/
        date_format: slash
        selector: "div.information-contnt-block, div.notices-box"  # 「インフォメーション」と「お知らせ」欄
  - name: いわて富士大学
    homepage: https://www.fuji-u.ac.jp/
    sources:
      - type: rss
        url: https://www.fuji-u.ac.jp/feed/
  - name: 国立天文台 水沢VLBI観測所
    homepage: https://www.miz.nao.ac.jp/
    sources:
      - type: scrape
        url: https://www.miz.nao.ac.jp/content/news/topics.html
        date_format: dotted
        selector: "div.views-row"  # 記事1件ずつ
        date_position: after       # 日付がタイトルの後ろにある
      - type: scrape
        url: https://www.miz.nao.ac.jp/content/news/announce.1.html
        date_format: dotted
        selector: "div.views-row"  # 記事1件ずつ
        date_position: after       # 日付がタイトルの後ろにある
  - name: 東京大学 国際沿岸海洋研究センター
    homepage: https://www.icrc.aori.u-tokyo.ac.jp/
    sources:
      - type: scrape
        url: https://www.icrc.aori.u-tokyo.ac.jp/archive.html
        date_format: kanji
        selector: "article.sub dl.topics"  # 本文のお知らせ一覧だけ（左メニューを除く）
        title_from: text                   # 「詳細はこちら」形式なので本文をタイトルにする
